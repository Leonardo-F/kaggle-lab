name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test packing engine
        run: python -m unittest discover -s competitions/squares-in-squares/experiments -p 'test_*.py' -v
      - name: Test quantum cost model
        run: python -m unittest discover -s competitions/google-quantum-circuit-compilation/experiments -p 'test_*.py' -v
      - name: Validate sample submission
        run: |
          python competitions/squares-in-squares/algorithms/packing.py generate --max-n 20 --output /tmp/sample.csv
          python competitions/squares-in-squares/algorithms/packing.py validate --input /tmp/sample.csv
      - name: Syntax-check browser JavaScript
        run: |
          node --check competitions/squares-in-squares/simulator/app.js
          node --check competitions/squares-in-squares/simulator/packing-core.js
      - name: Test browser geometry and complete CSV
        run: node --test competitions/squares-in-squares/experiments/test_core.cjs
      - name: Rebuild standalone HTML
        run: |
          python competitions/squares-in-squares/simulator/build_standalone.py
          git diff --exit-code -- competitions/squares-in-squares/simulator/SquarePackingStudio-standalone.html
