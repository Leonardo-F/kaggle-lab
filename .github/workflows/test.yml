name: Competition checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification and documentation dependencies
        run: |
          python -m pip install -r competitions/squares-in-squares/requirements.txt -r competitions/google-quantum-circuit-compilation/requirements.txt -r competitions/santa-2026/requirements.txt -r competitions/santa-2026/docs/requirements-docs.txt
      - name: Test packing engine
        run: python -m unittest discover -s competitions/squares-in-squares/experiments -p 'test_*.py' -v
      - name: Test quantum compilation
        run: python -m unittest discover -s competitions/google-quantum-circuit-compilation/experiments -p 'test_*.py' -v
      - name: Validate sample submission
        run: |
          python competitions/squares-in-squares/algorithms/packing.py generate --max-n 20 --output /tmp/sample.csv
          python competitions/squares-in-squares/algorithms/packing.py validate --input /tmp/sample.csv
      - name: Syntax-check browser JavaScript
        run: |
          node --check competitions/squares-in-squares/simulator/app.js
          node --check competitions/squares-in-squares/simulator/packing-core.js
      - name: Test browser geometry and complete CSV
        run: node --test competitions/squares-in-squares/experiments/test_core.cjs
      - name: Build Santa native C++17 constructors
        run: |
          g++ --version
          python competitions/santa-2026/src/algorithms/native/build.py
      - name: Test Santa solver, native build, checkpoint, verifier and report builder
        run: python -m unittest discover -s competitions/santa-2026/tests -p 'test_*.py' -v
      - name: Test Santa CSV replay and custom slots
        run: node --test competitions/santa-2026/tests/test_replay.cjs
      - name: Verify Santa interactive report is current
        run: python competitions/santa-2026/docs/build_report.py --check
      - name: Verify Santa source review and unified bundle are current
        run: python web/build/build.py --check
      - name: Rebuild standalone HTML
        run: |
          python competitions/squares-in-squares/simulator/build_standalone.py
          git diff --exit-code -- competitions/squares-in-squares/simulator/SquarePackingStudio-standalone.html
      - name: Verify unified offline simulator is current
        run: python -m unittest discover -s web/tests -p 'test_*.py' -v
